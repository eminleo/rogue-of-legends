<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rogue of Legends</title>

    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rogue of Legends">

    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // PWA Manifest and Service Worker Registration
        const manifestData = {
            "name": "Rogue of Legends",
            "short_name": "RoL",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#0f172a"
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            background-color: #f6f3eb;
            background-image: 
                linear-gradient(#e2dfd5 1px, transparent 1px),
                linear-gradient(90deg, #e2dfd5 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1e293b;
            user-select: none;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        /* Lined Paper Style for Combat Log */
        .lined-paper-2 {
            background-color: #fefdf8;
            background-image: 
                linear-gradient(90deg, transparent 32px, #f87171 32px, #f87171 33px, transparent 33px),
                repeating-linear-gradient(transparent, transparent 21px, #cbd5e1 21px, #cbd5e1 22px);
            background-size: 100% 100%, 100% 22px;
            background-attachment: local;
            line-height: 22px;
            padding-left: 38px !important;
            padding-right: 10px !important;
            padding-top: 2px !important;
            padding-bottom: 2px !important;
            border: 2px solid #334155;
            border-radius: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.12);
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            grid-template-rows: repeat(9, minmax(0, 1fr));
            gap: 1px;
            background-color: #334155;
            padding: 3px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25), 0 0 0 2px #334155;
            position: relative;
            touch-action: none;
            width: 100%;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            overflow: visible;
        }

        .grid-cell {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #fcfbf7;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            width: 100%;
            height: 100%;
            overflow: visible;
            box-sizing: border-box;
        }

        .obstacle-block {
            position: absolute;
            inset: 2px;
            background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
            border: 2px solid #334155;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 2px 4px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        @keyframes floatAndFade {
            0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-20px); }
            100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); }
        }

        .floating-text {
            position: absolute;
            left: 50%;
            top: 30%;
            transform: translate(-50%, -50%);
            font-weight: 900;
            font-size: 1.3rem;
            pointer-events: none;
            z-index: 70;
            animation: floatAndFade 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            text-shadow: 0px 2px 4px rgba(255,255,255,0.9), 0px 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .floating-damage { color: #dc2626; }
        .floating-heal { color: #059669; }
        .floating-miss { color: #334155; }

        .dice-d6 {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 2.5px solid #0f172a;
            flex-shrink: 0;
        }

        @keyframes diceRoll {
            0% { transform: rotate(0deg); opacity: 0.3; }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); opacity: 1; }
        }
        .rolling-dice { animation: diceRoll 0.4s ease-out; }

        .valid-move {
            background-color: rgba(245, 158, 11, 0.45) !important;
            border: 2px dashed #d97706 !important;
            cursor: pointer;
        }
        .valid-heal {
            background-color: rgba(16, 185, 129, 0.45) !important;
            border: 2px dashed #059669 !important;
            cursor: pointer;
        }
        .valid-target {
            background-color: rgba(239, 68, 68, 0.45) !important;
            border: 2px dashed #dc2626 !important;
            cursor: pointer;
            animation: pulseTarget 1s infinite alternate;
        }
        .valid-skill {
            background-color: rgba(59, 130, 246, 0.45) !important;
            border: 2px dashed #2563eb !important;
            cursor: pointer;
            animation: pulseSkill 1s infinite alternate;
        }
        @keyframes pulseTarget {
            0% { box-shadow: inset 0 0 4px #ef4444; }
            100% { box-shadow: inset 0 0 12px #ef4444; }
        }
        @keyframes pulseSkill {
            0% { box-shadow: inset 0 0 4px #3b82f6; }
            100% { box-shadow: inset 0 0 12px #3b82f6; }
        }

        .impact-burst {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 45;
            background: radial-gradient(circle, rgba(239,68,68,0.85) 0%, rgba(245,158,11,0.5) 50%, transparent 75%);
            border-radius: 50%;
            animation: impactFlash 0.4s ease-out forwards;
        }

        @keyframes impactFlash {
            0% { opacity: 0; transform: scale(0.2); }
            50% { opacity: 1; transform: scale(1.3); }
            100% { opacity: 0; transform: scale(1.6); }
        }

        .character-avatar {
            z-index: 10;
            pointer-events: none;
        }

        @keyframes activeTurnGlow {
            0% { box-shadow: 0 0 6px 2px #3b82f6, 0 0 12px 4px rgba(59, 130, 246, 0.7); }
            50% { box-shadow: 0 0 12px 4px #60a5fa, 0 0 22px 8px rgba(96, 165, 250, 0.9); }
            100% { box-shadow: 0 0 6px 2px #3b82f6, 0 0 12px 4px rgba(59, 130, 246, 0.7); }
        }

        .active-turn-avatar {
            border-color: #60a5fa !important;
            animation: activeTurnGlow 1.4s infinite ease-in-out;
            z-index: 25 !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-[100dvh] max-h-[100dvh] flex flex-col justify-center items-center p-2.5 max-w-sm mx-auto overflow-hidden text-slate-800">

    <div class="w-full flex flex-col justify-center items-center space-y-1.5 h-full my-auto max-h-[100dvh]">

        <main class="w-full flex justify-center items-center shrink-0">

            </div>
        </div>

                            <i class="fa-solid fa-rotate-right text-[10px]"></i>
                        </button>

                            <div id="game-phase-text" class="text-emerald-600 font-bold truncate max-w-[55px] leading-tight text-[8px]">準備中</div>
                        </div>
                    </div>

                    <div class="flex items-center overflow-x-auto no-scrollbar flex-1 py-0.5 px-0.5">
                        <div id="turn-order-container" class="flex items-center gap-1.5 py-0.5 px-0.5 justify-start min-w-max">
                            <!-- 動態注入順序圖示 -->
                        </div>

                </div>

                <!-- 中層：當前角色資訊、檢定顯示與結束回合按鈕 -->
                <div class="flex items-center justify-between h-7 border-b border-slate-300 pb-1.5">
                    <div id="active-player-info" class="flex items-center space-x-1.5 text-xs truncate max-w-[130px]">

                    <div id="inline-roll-status" class="invisible flex items-center gap-1 text-[11px] bg-white px-2 py-0.5 rounded-lg border-2 border-indigo-500/60 h-6">
                        <!-- 動態注入檢定骰子 -->
                    </div>

                    <button id="btn-end-turn" onclick="manualEndTurn()" disabled class="px-2.5 py-1 bg-indigo-600 disabled:bg-slate-300 disabled:text-slate-500 text-white text-[11px] font-bold rounded-lg shadow border border-indigo-700 transition shrink-0">

    </div>

    <!-- 重開確認與遊戲結束 Modals -->
    <div id="confirm-reset-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity">
        <div class="bg-[#fefcf6] border-2 border-slate-800 rounded-2xl p-5 max-w-xs w-full text-center shadow-2xl space-y-4">
            <h3 class="text-base font-bold text-slate-800">確定要重新開始遊戲嗎？</h3>
            <p class="text-xs text-slate-500">當前對局進度將會遺失。</p>
            <div class="flex gap-2">

                再玩一局
            </button>
        </div>

    <script>
        const Sound = {
            ctx: null,
            init() { 
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            },
            playRoll() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120 + Math.random() * 200, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            playHit() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            },
            playMiss() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            },
            playHeal() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);

            if (!spaces || spaces.length === 0) return null;
            let minDist = Infinity;
            let closestSpaces = [];
            spaces.forEach(space => {
                const dist = Math.abs(space.r - targetR) + Math.abs(space.c - targetC);
                if (dist < minDist) {
                    minDist = dist;
                    closestSpaces = [space];
                } else if (dist === minDist) {
                    closestSpaces.push(space);
                }
            });
            return closestSpaces[Math.floor(Math.random() * closestSpaces.length)];

            for (let r = 0; r < 9; r++) {

                    grid[r][c] = ((Math.floor(r / 3) + (r % 3) * 3 + c) % 9) + 1;
                }
            }
            return grid;
        }

        async function phase1RollDice(player) {
            const sessionAtStart = currentGameSessionId;
            const cData = CLASSES[player.classKey];
            const sanitizedHp = Math.round(player.hp * 100) / 100;
            const diceCount = player.alive ? Math.max(1, Math.floor(sanitizedHp)) : 0;
            const container = document.getElementById('dice-pool-container');

            document.getElementById('dice-count-badge').innerText = `擲骰中...`;

            rolledDicePool = [];
            for (let i = 0; i < diceCount; i++) {
                const randomSideIdx = Math.floor(Math.random() * cData.diceSides.length);
                rolledDicePool.push({ ...cData.diceSides[randomSideIdx], id: i, used: false, diceType: cData.diceType });
            }

            for (let i = 0; i < 5; i++) {
                if (currentGameSessionId !== sessionAtStart) return;
                Sound.playRoll();
                container.innerHTML = '';
                for (let d = 0; d < diceCount; d++) {
                    const tempSide = cData.diceSides[Math.floor(Math.random() * cData.diceSides.length)];
                    if (cData.diceType === 'D6') {
                        container.innerHTML += `
                            <div class="dice-d6 ${tempSide.color} text-white rolling-dice !w-9 !h-9">
                                ${renderIcon(tempSide.icon, 'text-xs')}
                            </div>
                        `;
                    } else {
                        const fillColor = COLOR_HEX_MAP[tempSide.color] || '#f59e0b';
                        container.innerHTML += `
                            <div class="relative w-9 h-9 text-white rolling-dice flex-shrink-0">
                                <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 36 36">
                                    <polygon points="18,2 34,34 2,34" fill="${fillColor}" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
                                </svg>
                                <div class="relative z-10 flex flex-col items-center justify-end pb-1.5 h-full w-full">
                                    ${renderIcon(tempSide.icon, 'text-xs')}
                                </div>
                            </div>
                        `;
                    }
                }
                await new Promise(r => setTimeout(r, 70));
            }

            if (currentGameSessionId !== sessionAtStart) return;
            renderDicePoolUI();

            if (player.isHuman) {
                document.getElementById('btn-end-turn').disabled = false;
            } else {
                document.getElementById('btn-end-turn').disabled = true;
                await runAITurn(player);
            }
        }

        function renderDicePoolUI() {
            const container = document.getElementById('dice-pool-container');
            if (!turnOrder || turnOrder.length === 0 || currentTurnIdx >= turnOrder.length) return;
            const activePlayer = players[turnOrder[currentTurnIdx]];
            if (!activePlayer) return;

            const usableCount = rolledDicePool.filter(d => !d.used).length;
            document.getElementById('dice-count-badge').innerText = `${usableCount} 可用`;
            container.innerHTML = '';

            if (rolledDicePool.length === 0 || usableCount === 0) {
                container.innerHTML = `<span class="text-xs text-slate-500">無可用骰子</span>`;
                return;
            }

            rolledDicePool.forEach((dice, idx) => {
                const isSelected = selectedDiceIdx === idx;
                const diceBtn = document.createElement('button');
                diceBtn.disabled = dice.used || !activePlayer.isHuman || isExecutingAction;

                if (dice.diceType === 'D6') {
                    diceBtn.className = `dice-d6 ${dice.color} text-white transition ${
                        dice.used ? '!opacity-20 !brightness-50 cursor-not-allowed border-transparent grayscale' : 'cursor-pointer opacity-90'
                    } ${isSelected ? 'ring-2 ring-yellow-300' : ''}`;
                    diceBtn.onclick = () => selectDiceForHuman(idx);
                    diceBtn.innerHTML = `
                        ${renderIcon(dice.icon, 'text-xs')}
                        <span class="text-[8px] font-bold mt-0.5">${dice.label}</span>
                    `;
                } else {
                    const fillColor = COLOR_HEX_MAP[dice.color] || '#f59e0b';
                    diceBtn.className = `relative w-9 h-9 text-white transition flex items-center justify-center ${
                        dice.used ? '!opacity-20 !brightness-50 cursor-not-allowed grayscale' : 'cursor-pointer opacity-90'
                    } ${isSelected ? 'filter drop-shadow-[0_0_4px_rgba(253,224,71,0.9)]' : ''}`;
                    diceBtn.onclick = () => selectDiceForHuman(idx);
                    diceBtn.innerHTML = `
                        <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 36 36">
                            <polygon points="18,2 34,34 2,34" fill="${fillColor}" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
                        </svg>
                        <div class="relative z-10 flex flex-col items-center justify-end pb-1 h-full w-full">
                            ${renderIcon(dice.icon, 'text-[10px]')}
                            <span class="text-[8px] font-bold leading-tight mt-0.5">${dice.label}</span>
                        </div>
                    `;
                }
                container.appendChild(diceBtn);
            });
        }

        function selectDiceForHuman(diceIdx) {
            if (isExecutingAction) return;
            clearBoardHighlights();
            if (rolledDicePool[diceIdx].used) return;

            if (selectedDiceIdx === diceIdx) {
                selectedDiceIdx = null;
            } else {
                selectedDiceIdx = diceIdx;
                const dice = rolledDicePool[selectedDiceIdx];
                const p = players[turnOrder[currentTurnIdx]];

                if (dice.type === 'HEAL') {
                    logCombat("💡 提示：請點擊棋盤上自己的位置來進行 1 HP 回血");
                } else if (dice.type === 'ATTACK' || dice.type === 'SKILL') {
                    const targets = getValidTargetsForClass(p, dice.type);
                    if (targets.length === 0) {
                        logCombat("⚠️ 提示：當前範圍內無有效目標/空格");
                    }
                }
                highlightValidActionsForHuman();
            }
            renderDicePoolUI();
        }

                        <span class="text-[10px] text-indigo-900 font-bold">${attacker.name}:</span>

                            <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 24 24">

        function confirmResetGame() {
            const modal = document.getElementById('confirm-reset-modal');
            if (modal) modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeResetConfirm() {
            const modal = document.getElementById('confirm-reset-modal');
            if (modal) modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function executeResetGame() {
            closeResetConfirm();
            initGame();
        }

        function getValidTargetsForClass(p, actionType = 'ATTACK', customPos = null) {
            const targets = [];
            const activeR = customPos ? customPos.r : p.r;
            const activeC = customPos ? customPos.c : p.c;

            if (p.classKey === 'warrior') {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = activeR + dr, nc = activeC + dc;
                        if (isValidGrid(nr, nc)) {
                            const enemy = getPlayerAt(nr, nc);
                            const obs = obstacles[`${nr},${nc}`];
                            if ((enemy && enemy.id !== p.id && enemy.alive) || (obs && obs.hp > 0)) {
                                targets.push({ r: nr, c: nc, target: enemy || obs, isObstacle: !!obs });
                            }
                        }
                    }
                }
            } else if (p.classKey === 'tank') {
                const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                dirs.forEach(d => {
                    const nr = activeR + d.r, nc = activeC + d.c;
                    if (isValidGrid(nr, nc)) {
                        const enemy = getPlayerAt(nr, nc);
                        const obs = obstacles[`${nr},${nc}`];
                        if ((enemy && enemy.id !== p.id && enemy.alive) || (obs && obs.hp > 0)) {
                            targets.push({ r: nr, c: nc, target: enemy || obs, isObstacle: !!obs });
                        }
                    }
                });
            } else if (p.classKey === 'mage') {
                if (actionType === 'ATTACK') {
                    players.forEach(other => {
                        if (other.id !== p.id && other.alive) {
                            const dist = Math.abs(other.r - activeR) + Math.abs(other.c - activeC);
                            if (dist <= 4) targets.push({ r: other.r, c: other.c, target: other, isObstacle: false });
                        }
                    });
                    Object.keys(obstacles).forEach(key => {
                        if (obstacles[key].hp > 0) {
                            const [r, c] = key.split(',').map(Number);
                            const dist = Math.abs(r - activeR) + Math.abs(c - activeC);
                            if (dist <= 4) targets.push({ r, c, target: obstacles[key], isObstacle: true });
                        }
                    });
                } else {
                    players.forEach(other => {
                        if (other.id !== p.id && other.alive) targets.push({ r: other.r, c: other.c, target: other, isObstacle: false });
                    });
                    Object.keys(obstacles).forEach(key => {
                        if (obstacles[key].hp > 0) {
                            const [r, c] = key.split(',').map(Number);
                            targets.push({ r, c, target: obstacles[key], isObstacle: true });
                        }
                    });
                }
            } else if (p.classKey === 'archer') {
                const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}, {r:-1,c:-1}, {r:-1,c:1}, {r:1,c:-1}, {r:1,c:1}];
                dirs.forEach(d => {
                    let step = 1;
                    while (true) {
                        const nr = activeR + d.r * step, nc = activeC + d.c * step;
                        if (!isValidGrid(nr, nc)) break;
                        const enemy = getPlayerAt(nr, nc);
                        const obs = obstacles[`${nr},${nc}`];

                        if (enemy && enemy.alive) {
                            if (enemy.id === p.id) {
                                step++;
                                continue;
                            }
                            targets.push({ r: nr, c: nc, target: enemy, isObstacle: false });
                            break;
                        }
                        if (obs && obs.hp > 0) {
                            targets.push({ r: nr, c: nc, target: obs, isObstacle: true });
                            break;
                        }
                        step++;
                    }
                });
            } else if (p.classKey === 'assassin') {
                if (actionType === 'ATTACK') {
                    const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                    dirs.forEach(d => {
                        const nr = activeR + d.r, nc = activeC + d.c;
                        if (isValidGrid(nr, nc)) {
                            const enemy = getPlayerAt(nr, nc);
                            const obs = obstacles[`${nr},${nc}`];
                            if ((enemy && enemy.id !== p.id && enemy.alive) || (obs && obs.hp > 0)) {
                                targets.push({ r: nr, c: nc, target: enemy || obs, isObstacle: !!obs });
                            }
                        }
                    });
                } else if (actionType === 'SKILL') {
                    for (let r = 0; r < 9; r++) {
                        for (let c = 0; c < 9; c++) {
                            const dist = Math.abs(r - activeR) + Math.abs(c - activeC);
                            if (dist >= 1 && dist <= 2 && !isOccupied(r, c)) {
                                targets.push({ r, c, isEmptySpace: true });
                            }
                        }
                    }
                }
            } else if (p.classKey === 'berserker') {
                if (actionType === 'SKILL') {
                    const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                    dirs.forEach(d => {
                        const nr = activeR + d.r, nc = activeC + d.c;
                        if (isValidGrid(nr, nc)) {
                            const enemy = getPlayerAt(nr, nc);
                            const obs = obstacles[`${nr},${nc}`];
                            if ((enemy && enemy.id !== p.id && enemy.alive) || (obs && obs.hp > 0)) {
                                targets.push({ r: nr, c: nc, target: enemy || obs, isObstacle: !!obs });
                            }
                        }
                    });
                }
            } else if (p.classKey === 'scout') {
                if (actionType === 'ATTACK') {
                    for (let r = 0; r < 9; r++) {
                        for (let c = 0; c < 9; c++) {
                            const dist = Math.abs(r - activeR) + Math.abs(c - activeC);
                            if (dist >= 1 && dist <= 2) {
                                const enemy = getPlayerAt(r, c);
                                const obs = obstacles[`${r},${c}`];
                                if ((enemy && enemy.id !== p.id && enemy.alive) || (obs && obs.hp > 0)) {
                                    targets.push({ r, c, target: enemy || obs, isObstacle: !!obs });
                                }
                            }
                        }
                    }
                } else if (actionType === 'SKILL') {
                    for (let r = 0; r < 9; r++) {
                        for (let c = 0; c < 9; c++) {
                            const dist = Math.abs(r - activeR) + Math.abs(c - activeC);
                            if (dist >= 1 && dist <= 2 && !isOccupied(r, c)) {
                                targets.push({ r, c, isEmptySpace: true });
                            }
                        }
                    }
                }
            } else if (p.classKey === 'ninja') {
                if (actionType === 'ATTACK') {
                    for (let r = 0; r < 9; r++) {
                        for (let c = 0; c < 9; c++) {
                            const dist = Math.abs(r - activeR) + Math.abs(c - activeC);
                            if (dist >= 1 && dist <= 2) {
                                const enemy = getPlayerAt(r, c);
                                const obs = obstacles[`${r},${c}`];
                                if ((enemy && enemy.id !== p.id && enemy.alive) || (obs && obs.hp > 0)) {
                                    targets.push({ r, c, target: enemy || obs, isObstacle: !!obs });
                                }
                            }
                        }
                    }
                } else if (actionType === 'SKILL') {
                    Object.keys(obstacles).forEach(key => {
                        if (obstacles[key].hp > 0) {
                            const [r, c] = key.split(',').map(Number);
                            const dist = Math.abs(r - activeR) + Math.abs(c - activeC);
                            if (dist >= 1 && dist <= 2) {
                                targets.push({ r, c, target: obstacles[key], isObstacle: true });
                            }
                        }
                    });
                }
            } else if (p.classKey === 'alchemist') {
                if (actionType === 'ATTACK') {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = activeR + dr, nc = activeC + dc;
                            if (isValidGrid(nr, nc)) {
                                const enemy = getPlayerAt(nr, nc);
                                const obs = obstacles[`${nr},${nc}`];
                                if ((enemy && enemy.id !== p.id && enemy.alive) || (obs && obs.hp > 0)) {
                                    targets.push({ r: nr, c: nc, target: enemy || obs, isObstacle: !!obs });
                                }
                            }
                        }
                    }
                } else if (actionType === 'SKILL') {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = activeR + dr, nc = activeC + dc;
                            if (isValidGrid(nr, nc) && !isOccupied(nr, nc)) {
                                targets.push({ r: nr, c: nc, isEmptySpace: true });
                            }
                        }
                    }
                }
            }
            return targets;
        }

        function clearBoardHighlights() {
            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('valid-move', 'valid-heal', 'valid-target', 'valid-skill'));
        }

        function highlightValidActionsForHuman() {
            clearBoardHighlights();
            if (selectedDiceIdx === null) return;
            const activePlayer = players[turnOrder[currentTurnIdx]];
            if (!activePlayer || !activePlayer.isHuman) return;

            const dice = rolledDicePool[selectedDiceIdx];
            if (!dice || dice.used) return;

            if (dice.type === 'MOVE') {
                const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                dirs.forEach(d => {
                    const nr = activePlayer.r + d.r;
                    const nc = activePlayer.c + d.c;
                    if (isValidGrid(nr, nc) && !isOccupied(nr, nc)) {
                        const cell = document.getElementById(`cell-${nr}-${nc}`);
                        if (cell) cell.classList.add('valid-move');
                    }
                });
            } else if (dice.type === 'HEAL') {
                const cell = document.getElementById(`cell-${activePlayer.r}-${activePlayer.c}`);
                if (cell) cell.classList.add('valid-heal');
            } else if (dice.type === 'ATTACK') {
                const targets = getValidTargetsForClass(activePlayer, 'ATTACK');
                targets.forEach(t => {
                    const cell = document.getElementById(`cell-${t.r}-${t.c}`);
                    if (cell) cell.classList.add('valid-target');
                });
            } else if (dice.type === 'SKILL') {
                const targets = getValidTargetsForClass(activePlayer, 'SKILL');
                targets.forEach(t => {
                    const cell = document.getElementById(`cell-${t.r}-${t.c}`);
                    if (cell) cell.classList.add('valid-skill');
                });
            }
        }

        async function handleCellClick(r, c) {
            const activePlayer = players[turnOrder[currentTurnIdx]];
            if (!activePlayer || !activePlayer.isHuman || selectedDiceIdx === null || isExecutingAction) return;

            const dice = rolledDicePool[selectedDiceIdx];
            if (!dice || dice.used) return;

            if (dice.type === 'MOVE') {
                const dist = Math.abs(r - activePlayer.r) + Math.abs(c - activePlayer.c);
                if (dist === 1 && !isOccupied(r, c)) {
                    await executeMoveAction(activePlayer, r, c);
                }
            } else if (dice.type === 'HEAL') {
                if (r === activePlayer.r && c === activePlayer.c) {
                    await executeHealAction(activePlayer);
                }
            } else if (dice.type === 'ATTACK') {
                const targets = getValidTargetsForClass(activePlayer, 'ATTACK');
                const match = targets.find(t => t.r === r && t.c === c);
                if (match) {
                    await executeAttackAction(activePlayer, match, 'ATTACK');
                }
            } else if (dice.type === 'SKILL') {
                const targets = getValidTargetsForClass(activePlayer, 'SKILL');
                const match = targets.find(t => t.r === r && t.c === c);
                if (match) {
                    await executeSkillAction(activePlayer, match);
                }
            }
        }

        async function executeMoveAction(player, targetR, targetC) {
            isExecutingAction = true;
            renderDicePoolUI();
            try {
                player.r = targetR;
                player.c = targetC;
                updateBoardElements();
                logCombat(`👟 ${player.name} 移動至 (${targetR + 1}, ${targetC + 1})`);
                consumeSelectedDice();
                clearBoardHighlights();
            } finally {
                isExecutingAction = false;
                renderDicePoolUI();
            }
        }

        async function executeHealAction(player) {
            isExecutingAction = true;
            renderDicePoolUI();
            try {
                if (player.hp < player.maxHp) {
                    player.hp = Math.min(player.maxHp, Math.round((player.hp + 1) * 10) / 10);
                    Sound.playHeal();
                    showFloatingText(player.r, player.c, "+1", "floating-heal");
                    logCombat(`💖 ${player.name} 回復 1 點 HP (${formatHp(player.hp)}/${player.maxHp})`);
                } else {
                    logCombat(`💖 ${player.name} 血量已滿，回血無效`);
                }
                updateBoardElements();
                consumeSelectedDice();
                clearBoardHighlights();
            } finally {
                isExecutingAction = false;
                renderDicePoolUI();
            }
        }

        async function executeAttackAction(attacker, targetObj, actionType = 'ATTACK') {
            isExecutingAction = true;
            renderDicePoolUI();
            clearBoardHighlights();
            try {
                const validTargets = getValidTargetsForClass(attacker, actionType);
                const isValid = validTargets.some(t => t.r === targetObj.r && t.c === targetObj.c);
                if (!isValid) {
                    logCombat(`⚠️ ${attacker.name} 目標不在有效射程內，行動取消`);
                    consumeSelectedDice();
                    return;
                }

                const cData = CLASSES[attacker.classKey];
                logCombat(`⚔️ ${attacker.name} 發動【普通攻擊】！`);

                await playAttackTrajectoryAnimation(attacker, targetObj.r, targetObj.c);

                const diceType = cData.diceType;
                const maxRoll = diceType === 'D6' ? 6 : 4;
                const rollResult = Math.floor(Math.random() * maxRoll) + 1;
                const isHit = rollResult >= cData.minHit;

                await showHitCheckModal(attacker, rollResult, isHit, cData);

                let damageAmount = 1;
                if (attacker.classKey === 'scout' && actionType === 'ATTACK') {
                    damageAmount = 0.5;
                } else if (attacker.classKey === 'ninja' && actionType === 'ATTACK') {
                    damageAmount = 0.7;
                }

                if (isHit) {
                    Sound.playHit();
                    logCombat(`🎯 命中！擲出 ${rollResult} (需要: ${cData.hitDesc})`);
                    if (attacker.classKey === 'warrior' || (attacker.classKey === 'alchemist' && actionType === 'ATTACK')) {
                        let areaTargets = getValidTargetsForClass(attacker, actionType);
                        areaTargets.forEach(t => applyDamage(t.target, damageAmount, t.r, t.c, t.isObstacle, attacker));
                    } else {
                        applyDamage(targetObj.target, damageAmount, targetObj.r, targetObj.c, targetObj.isObstacle, attacker);
                    }
                } else {
                    Sound.playMiss();
                    logCombat(`🌀 未命中！擲出 ${rollResult} (需要: ${cData.hitDesc})`);
                    showFloatingText(targetObj.r, targetObj.c, "MISS!", "floating-miss");
                }

                consumeSelectedDice();
                updateBoardElements();
            } finally {
                isExecutingAction = false;
                renderDicePoolUI();
            }
        }

        async function executeSkillAction(attacker, targetObj) {
            isExecutingAction = true;
            renderDicePoolUI();
            clearBoardHighlights();
            try {
                const cData = CLASSES[attacker.classKey];
                logCombat(`✨ ${attacker.name} 選擇目標 (${targetObj.r + 1}, ${targetObj.c + 1}) 發動【特殊技能】！`);

                const diceType = cData.diceType;
                const maxRoll = diceType === 'D6' ? 6 : 4;
                const rollResult = Math.floor(Math.random() * maxRoll) + 1;
                const isHit = rollResult >= cData.minHit;

                await showHitCheckModal(attacker, rollResult, isHit, cData);

                if (!isHit) {
                    Sound.playMiss();
                    logCombat(`🌀 ${attacker.name} 技能未命中！擲出 ${rollResult} (需要: ${cData.hitDesc})`);
                    showFloatingText(targetObj.r, targetObj.c, "MISS!", "floating-miss");
                } else {
                    Sound.playHit();
                    logCombat(`🎯 技能命中！擲出 ${rollResult} (需要: ${cData.hitDesc})`);

                    if (attacker.classKey === 'assassin') {
                        attacker.r = targetObj.r;
                        attacker.c = targetObj.c;
                        updateBoardElements();
                        logCombat(`🔮 刺客瞬移至 (${targetObj.r + 1}, ${targetObj.c + 1})！`);

                        if (attacker.hp < attacker.maxHp) {
                            attacker.hp = Math.min(attacker.maxHp, Math.round((attacker.hp + 0.5) * 10) / 10);
                            Sound.playHeal();
                            showFloatingText(attacker.r, attacker.c, "+0.5", "floating-heal");
                            logCombat(`💖 刺客回復 0.5 HP (${formatHp(attacker.hp)}/${attacker.maxHp})`);
                        }

                        const crossDirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                        crossDirs.forEach(d => {
                            const nr = attacker.r + d.r, nc = attacker.c + d.c;
                            if (isValidGrid(nr, nc)) {
                                const enemy = getPlayerAt(nr, nc);
                                const obs = obstacles[`${nr},${nc}`];
                                if (enemy && enemy.id !== attacker.id && enemy.alive) {
                                    applyDamage(enemy, 1, nr, nc, false, attacker);
                                } else if (obs && obs.hp > 0) {
                                    applyDamage(obs, 1, nr, nc, true, attacker);
                                }
                            }
                        });
                    } else if (attacker.classKey === 'berserker') {
                        await playAttackTrajectoryAnimation(attacker, targetObj.r, targetObj.c);

                        if (attacker.hp < attacker.maxHp) {
                            attacker.hp = Math.min(attacker.maxHp, Math.round((attacker.hp + 0.7) * 10) / 10);
                            Sound.playHeal();
                            showFloatingText(attacker.r, attacker.c, "+0.7", "floating-heal");
                            logCombat(`💖 狂戰士觸發血誓，回復 0.7 HP (${formatHp(attacker.hp)}/${attacker.maxHp})`);
                        }

                        applyDamage(targetObj.target, 1, targetObj.r, targetObj.c, targetObj.isObstacle, attacker);
                    } else if (attacker.classKey === 'scout') {
                        attacker.r = targetObj.r;
                        attacker.c = targetObj.c;
                        updateBoardElements();
                        logCombat(`🏹 斥侯靈活位移至 (${targetObj.r + 1}, ${targetObj.c + 1})！`);

                        if (attacker.hp < attacker.maxHp) {
                            attacker.hp = Math.min(attacker.maxHp, Math.round((attacker.hp + 0.3) * 10) / 10);
                            Sound.playHeal();
                            showFloatingText(attacker.r, attacker.c, "+0.3", "floating-heal");
                            logCombat(`💖 斥侯回復 0.3 HP (${formatHp(attacker.hp)}/${attacker.maxHp})`);
                        }
                    } else if (attacker.classKey === 'mage') {
                        await playAttackTrajectoryAnimation(attacker, targetObj.r, targetObj.c);
                        applyDamage(targetObj.target, 1, targetObj.r, targetObj.c, targetObj.isObstacle, attacker);
                    } else if (attacker.classKey === 'ninja') {
                        const oldR = attacker.r, oldC = attacker.c;
                        const newR = targetObj.r, newC = targetObj.c;
                        const obsKey = `${newR},${newC}`;
                        const oldKey = `${oldR},${oldC}`;
                        const obsData = obstacles[obsKey];

                        delete obstacles[obsKey];
                        if (obsData && typeof obsData === 'object') {
                            obstacles[oldKey] = obsData;
                        }

                        attacker.r = newR;
                        attacker.c = newC;
                        updateBoardElements();
                        logCombat(`🥷 忍者使用替身術與 (${newR + 1}, ${newC + 1}) 的障礙物互換位置！`);

                        if (attacker.hp < attacker.maxHp) {
                            attacker.hp = Math.min(attacker.maxHp, Math.round((attacker.hp + 1) * 10) / 10);
                            Sound.playHeal();
                            showFloatingText(attacker.r, attacker.c, "+1", "floating-heal");
                            logCombat(`💖 忍者回復 1 HP (${formatHp(attacker.hp)}/${attacker.maxHp})`);
                        }

                        const crossDirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                        crossDirs.forEach(d => {
                            const nr = attacker.r + d.r, nc = attacker.c + d.c;
                            if (isValidGrid(nr, nc)) {
                                const enemy = getPlayerAt(nr, nc);
                                if (enemy && enemy.id !== attacker.id && enemy.alive) {
                                    applyDamage(enemy, 0.7, nr, nc, false, attacker);
                                }
                            }
                        });
                    } else if (attacker.classKey === 'alchemist') {
                        const newR = targetObj.r, newC = targetObj.c;
                        obstacles[`${newR},${newC}`] = { hp: 1, maxHp: 1 };
                        Sound.playBreak();
                        logCombat(`🧪 鍊金術士於 (${newR + 1}, ${newC + 1}) 調製化合物，生成了 1 HP 的障礙物！`);
                        showFloatingText(newR, newC, "煉金牆", "floating-heal");
                    }
                }

                consumeSelectedDice();
                updateBoardElements();
            } finally {
                isExecutingAction = false;
                renderDicePoolUI();
            }
        }

        async function playAttackTrajectoryAnimation(attacker, targetR, targetC) {
            const sessionAtStart = currentGameSessionId;
            const board = document.getElementById('sudoku-board');
            if (!board) return;

            const x1 = ((attacker.c + 0.5) / 9) * 100;
            const y1 = ((attacker.r + 0.5) / 9) * 100;
            const x2 = ((targetC + 0.5) / 9) * 100;
            const y2 = ((targetR + 0.5) / 9) * 100;

            const svgContainer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svgContainer.setAttribute('class', 'absolute inset-0 w-full h-full pointer-events-none z-50 overflow-visible');

            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
            const markerId = `arrow-${Math.random().toString(36).substring(2, 8)}`;
            marker.setAttribute('id', markerId);
            marker.setAttribute('viewBox', '0 0 10 10');
            marker.setAttribute('refX', '6');
            marker.setAttribute('refY', '5');
            marker.setAttribute('markerWidth', '6');
            marker.setAttribute('markerHeight', '6');
            marker.setAttribute('orient', 'auto-start-reverse');

            const arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            arrowPath.setAttribute('d', 'M 0 1 L 10 5 L 0 9 z');
            arrowPath.setAttribute('fill', '#f59e0b');
            marker.appendChild(arrowPath);
            defs.appendChild(marker);
            svgContainer.appendChild(defs);

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', `${x1}%`);
            line.setAttribute('y1', `${y1}%`);
            line.setAttribute('x2', `${x1}%`);
            line.setAttribute('y2', `${y1}%`);
            line.setAttribute('stroke', '#ef4444');
            line.setAttribute('stroke-width', '3.5');
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('marker-end', `url(#${markerId})`);

            svgContainer.appendChild(line);
            board.appendChild(svgContainer);

            const duration = 220;
            const startTime = performance.now();

            await new Promise(resolve => {
                function animateFrame(now) {
                    if (currentGameSessionId !== sessionAtStart) {
                        svgContainer.remove();
                        resolve();
                        return;
                    }
                    const elapsed = now - startTime;
                    const progress = Math.min(1, elapsed / duration);

                    const currentX = x1 + (x2 - x1) * progress;
                    const currentY = y1 + (y2 - y1) * progress;

                    line.setAttribute('x2', `${currentX}%`);
                    line.setAttribute('y2', `${currentY}%`);

                    if (progress < 1) {
                        requestAnimationFrame(animateFrame);
                    } else {
                        resolve();
                    }
                }
                requestAnimationFrame(animateFrame);
            });

            if (currentGameSessionId !== sessionAtStart) return;

            const targetCell = document.getElementById(`cell-${targetR}-${targetC}`);
            if (targetCell) {
                const burst = document.createElement('div');
                burst.className = 'impact-burst';
                targetCell.appendChild(burst);
                setTimeout(() => burst.remove(), 400);
            }

            await new Promise(r => setTimeout(r, 100));
            svgContainer.remove();
        }

        function applyDamage(target, amount, r, c, isObstacle, attacker) {
            target.hp = Math.round((target.hp - amount) * 10) / 10;
            showFloatingText(r, c, `-${amount}`, "floating-damage");

            if (isObstacle) {
                logCombat(`💥 障礙物遭受 ${amount} 點傷害 (剩餘 HP: ${Math.max(0, target.hp)})`);
                if (target.hp <= 0) {
                    Sound.playBreak();
                    logCombat(`🧱 障礙物已被摧毀！`);
                    delete obstacles[`${r},${c}`];

                    if (attacker) {
                        if (attacker.hp < attacker.maxHp) {
                            attacker.hp = Math.min(attacker.maxHp, Math.round((attacker.hp + 1) * 10) / 10);
                            Sound.playHeal();
                            showFloatingText(attacker.r, attacker.c, "+1", "floating-heal");
                            logCombat(`💖 ${attacker.name} 擊碎障礙物，回復 1 點 HP (${formatHp(attacker.hp)}/${attacker.maxHp})`);
                        } else {
                            logCombat(`💖 ${attacker.name} 擊碎障礙物 (血量已滿，未回復)`);
                        }
                    }
                }
            } else {
                logCombat(`🩸 ${target.name} 受到 ${amount} 點傷害 (剩餘 HP: ${Math.max(0, formatHp(target.hp))})`);
                if (target.hp <= 0) {
                    target.hp = 0;
                    target.alive = false;
                    logCombat(`💀 ${target.name} 陣亡！`);
                }
            }
            updateBoardElements();
        }

        function showFloatingText(r, c, text, className) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            if (!cell) return;

            const el = document.createElement('div');
            el.className = `floating-text ${className}`;
            el.innerText = text;
            cell.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function consumeSelectedDice() {
            if (selectedDiceIdx !== null && rolledDicePool[selectedDiceIdx]) {
                rolledDicePool[selectedDiceIdx].used = true;
                selectedDiceIdx = null;
            }
            renderDicePoolUI();
        }

        function manualEndTurn() {
            const btn = document.getElementById('btn-end-turn');
            if (!btn || btn.disabled || isExecutingAction) return;

            btn.disabled = true;

            const activePlayer = players[turnOrder[currentTurnIdx]];
            if (!activePlayer || !activePlayer.isHuman) return;

            clearBoardHighlights();
            selectedDiceIdx = null;
            logCombat(`⏭️ 手動結束回合`);
            currentTurnIdx++;
            processNextTurn();
        }

        function canUnitHitTargetFrom(unit, r, c, targetR, targetC) {
            if (!unit) return (Math.abs(r - targetR) + Math.abs(c - targetC) <= 1);
            const attackTargets = getValidTargetsForClass(unit, 'ATTACK', { r, c });
            if (attackTargets.some(t => t.r === targetR && t.c === targetC)) return true;
            const skillTargets = getValidTargetsForClass(unit, 'SKILL', { r, c });
            if (skillTargets.some(t => t.r === targetR && t.c === targetC)) return true;
            return false;
        }

        function findNextStepAStar(startR, startC, targetR, targetC, isFleeing = false, aiPlayer = null) {
            if (isFleeing) {
                const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                let candidates = [];
                let maxDist = -1;

                dirs.forEach(d => {
                    const nr = startR + d.r, nc = startC + d.c;
                    if (isValidGrid(nr, nc) && !isOccupied(nr, nc)) {
                        const dist = Math.abs(nr - targetR) + Math.abs(nc - targetC);
                        if (dist > maxDist) {
                            maxDist = dist;
                            candidates = [{ r: nr, c: nc }];
                        } else if (dist === maxDist) {
                            candidates.push({ r: nr, c: nc });
                        }
                    }
                });

                if (candidates.length === 0) return null;

                if (aiPlayer && aiPlayer.classKey === 'archer') {
                    const inSightCandidates = candidates.filter(c => {
                        const dr = Math.abs(c.r - targetR);
                        const dc = Math.abs(c.c - targetC);
                        return dr === 0 || dc === 0 || dr === dc;
                    });
                    if (inSightCandidates.length > 0) {
                        return inSightCandidates[Math.floor(Math.random() * inSightCandidates.length)];
                    }
                } else {
                    const outOfSightCandidates = candidates.filter(c => {
                        const dr = Math.abs(c.r - targetR);
                        const dc = Math.abs(c.c - targetC);
                        return dr !== 0 && dc !== 0 && dr !== dc;
                    });
                    if (outOfSightCandidates.length > 0) {
                        return outOfSightCandidates[Math.floor(Math.random() * outOfSightCandidates.length)];
                    }
                }

                return candidates[Math.floor(Math.random() * candidates.length)];
            }

            if (startR === targetR && startC === targetC) return null;

            const openSet = [];
            const closedSet = new Set();
            const gScore = {};
            const fScore = {};
            const cameFrom = {};

            const startKey = `${startR},${startC}`;
            gScore[startKey] = 0;
            fScore[startKey] = Math.abs(startR - targetR) + Math.abs(startC - targetC);
            openSet.push({ r: startR, c: startC, f: fScore[startKey] });

            while (openSet.length > 0) {
                openSet.sort((a, b) => a.f - b.f);
                const current = openSet.shift();
                const currentKey = `${current.r},${current.c}`;

                if (canUnitHitTargetFrom(aiPlayer, current.r, current.c, targetR, targetC)) {
                    let curr = currentKey;
                    let path = [];
                    while (cameFrom[curr]) {
                        path.push(curr);
                        curr = cameFrom[curr];
                    }
                    if (path.length > 0) {
                        const firstStep = path[path.length - 1].split(',').map(Number);
                        return { r: firstStep[0], c: firstStep[1] };
                    }
                    return null;
                }

                closedSet.add(currentKey);

                const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                dirs.forEach(d => {
                    const nr = current.r + d.r, nc = current.c + d.c;
                    const neighborKey = `${nr},${nc}`;

                    if (!isValidGrid(nr, nc) || closedSet.has(neighborKey)) return;

                    const isTargetTile = (nr === targetR && nc === targetC);
                    if (isOccupied(nr, nc) && !isTargetTile) return;

                    const tentativeG = gScore[currentKey] + 1;
                    if (gScore[neighborKey] === undefined || tentativeG < gScore[neighborKey]) {
                        cameFrom[neighborKey] = currentKey;
                        gScore[neighborKey] = tentativeG;
                        const h = Math.abs(nr - targetR) + Math.abs(nc - targetC);
                        fScore[neighborKey] = tentativeG + h;

                        if (!openSet.some(node => node.r === nr && node.c === nc)) {
                            openSet.push({ r: nr, c: nc, f: fScore[neighborKey] });
                        }
                    }
                });
            }

            const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
            let fallbackCell = null;
            let minDist = 999;
            dirs.forEach(d => {
                const nr = startR + d.r, nc = startC + d.c;
                if (isValidGrid(nr, nc) && !isOccupied(nr, nc)) {
                    const dist = Math.abs(nr - targetR) + Math.abs(nc - targetC);
                    if (dist < minDist) {
                        minDist = dist;
                        fallbackCell = { r: nr, c: nc };
                    }
                }
            });
            return fallbackCell;
        }

        async function runAITurn(aiPlayer) {
            const sessionAtStart = currentGameSessionId;
            const cData = CLASSES[aiPlayer.classKey];

            function canHitHumanFrom(r, c, actionType) {
                const human = players.find(p => p.isHuman && p.alive);
                if (!human) return false;
                const targets = getValidTargetsForClass(aiPlayer, actionType, { r, c });
                return targets.some(t => t.target && !t.isObstacle && t.target.isHuman);
            }

            function getDamageForAction(actionType) {
                if (actionType === 'ATTACK') {
                    if (aiPlayer.classKey === 'scout') return 0.5;
                    if (aiPlayer.classKey === 'ninja') return 0.7;
                    return 1.0;
                }
                if (actionType === 'SKILL') {
                    if (cData.skillConfig && cData.skillConfig.damage > 0) {
                        return cData.skillConfig.damage;
                    }
                    if (aiPlayer.classKey === 'ninja') return 0.7;
                    return 1.0;
                }
                return 1.0;
            }

            function isAtOptimalPosition(r, c) {
                const human = players.find(p => p.isHuman && p.alive);
                if (!human) return true;
                const currentDist = Math.abs(human.r - r) + Math.abs(human.c - c);

                if (cData.aiType === 'aggressive') {
                    return canHitHumanFrom(r, c, 'ATTACK') || canHitHumanFrom(r, c, 'SKILL');
                } else {
                    const canHit = canHitHumanFrom(r, c, 'ATTACK') || canHitHumanFrom(r, c, 'SKILL');
                    if (!canHit) return false;

                    const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                    for (let d of dirs) {
                        const nr = r + d.r, nc = c + d.c;
                        if (isValidGrid(nr, nc) && !isOccupied(nr, nc)) {
                            const nextDist = Math.abs(human.r - nr) + Math.abs(human.c - nc);
                            if (nextDist > currentDist) {
                                return false;
                            }
                        }
                    }
                    return true;
                }
            }

            while (aiPlayer.alive) {
                if (currentGameSessionId !== sessionAtStart) return;

                const unusedDice = rolledDicePool.filter(d => !d.used);
                if (unusedDice.length === 0) break;

                const humanPlayer = players.find(p => p.isHuman && p.alive);
                if (!humanPlayer) break;

                // 優先級 1：生存回血 (Heal Priority)
                if (aiPlayer.hp < aiPlayer.maxHp) {
                    const healDice = unusedDice.find(d => d.type === 'HEAL');
                    if (healDice) {
                        selectedDiceIdx = rolledDicePool.findIndex(d => d === healDice);
                        await new Promise(r => setTimeout(r, 400));
                        if (currentGameSessionId !== sessionAtStart) return;
                        await executeHealAction(aiPlayer);
                        if (checkGameOver()) return;
                        continue;
                    }
                }

                const skillDice = unusedDice.find(d => d.type === 'SKILL');
                const attackDice = unusedDice.find(d => d.type === 'ATTACK');

                // 優先級 2：終結斬殺玩家 (Player Execution)
                if (skillDice) {
                    const dmg = getDamageForAction('SKILL');
                    if (humanPlayer.hp <= dmg && canHitHumanFrom(aiPlayer.r, aiPlayer.c, 'SKILL')) {
                        const targets = getValidTargetsForClass(aiPlayer, 'SKILL');
                        const humanTarget = targets.find(t => !t.isObstacle && t.target && t.target.isHuman);
                        if (humanTarget) {
                            selectedDiceIdx = rolledDicePool.findIndex(d => d === skillDice);
                            await new Promise(r => setTimeout(r, 450));
                            if (currentGameSessionId !== sessionAtStart) return;
                            await executeSkillAction(aiPlayer, humanTarget);
                            if (checkGameOver()) return;
                            continue;
                        }
                    }
                }

                if (attackDice) {
                    const dmg = getDamageForAction('ATTACK');
                    if (humanPlayer.hp <= dmg && canHitHumanFrom(aiPlayer.r, aiPlayer.c, 'ATTACK')) {
                        const targets = getValidTargetsForClass(aiPlayer, 'ATTACK');
                        const humanTarget = targets.find(t => !t.isObstacle && t.target && t.target.isHuman);
                        if (humanTarget) {
                            selectedDiceIdx = rolledDicePool.findIndex(d => d === attackDice);
                            await new Promise(r => setTimeout(r, 450));
                            if (currentGameSessionId !== sessionAtStart) return;
                            await executeAttackAction(aiPlayer, humanTarget, 'ATTACK');
                            if (checkGameOver()) return;
                            continue;
                        }
                    }
                }

                // 優先級 3：尾刀殘血障礙物吸血 (Obstacle Last-Hit / Deny - 通用 Data-Driven 判斷)
                if (aiPlayer.hp < aiPlayer.maxHp) {
                    if (attackDice) {
                        const dmg = getDamageForAction('ATTACK');
                        const validTargets = getValidTargetsForClass(aiPlayer, 'ATTACK');
                        const lastHittableObs = validTargets.find(t => t.isObstacle && t.target && t.target.hp <= dmg);
                        if (lastHittableObs) {
                            selectedDiceIdx = rolledDicePool.findIndex(d => d === attackDice);
                            await new Promise(r => setTimeout(r, 450));
                            if (currentGameSessionId !== sessionAtStart) return;
                            await executeAttackAction(aiPlayer, lastHittableObs, 'ATTACK');
                            if (checkGameOver()) return;
                            continue;
                        }
                    }

                    // ✅ 通用邏輯：只要該職業技能宣告可直接傷害障礙物，AI 就會嘗試使用技能尾刀
                    if (skillDice && cData.skillConfig && cData.skillConfig.canTargetObstacle && cData.skillConfig.isDirectDamage) {
                        const dmg = cData.skillConfig.damage || getDamageForAction('SKILL');
                        const validTargets = getValidTargetsForClass(aiPlayer, 'SKILL');
                        const lastHittableObs = validTargets.find(t => t.isObstacle && t.target && t.target.hp <= dmg);
                        if (lastHittableObs) {
                            selectedDiceIdx = rolledDicePool.findIndex(d => d === skillDice);
                            await new Promise(r => setTimeout(r, 450));
                            if (currentGameSessionId !== sessionAtStart) return;
                            await executeSkillAction(aiPlayer, lastHittableObs);
                            if (checkGameOver()) return;
                            continue;
                        }
                    }
                }

                // 優先級 4：職業專屬戰術技能 (Class-Specific Skill)
                if (aiPlayer.classKey === 'ninja' && skillDice) {
                    const skillObs = getValidTargetsForClass(aiPlayer, 'SKILL');
                    if (skillObs.length > 0) {
                        const chosenObs = findClosestSpaceToTarget(skillObs, humanPlayer.r, humanPlayer.c);
                        if (chosenObs) {
                            selectedDiceIdx = rolledDicePool.findIndex(d => d === skillDice);
                            await new Promise(r => setTimeout(r, 450));
                            if (currentGameSessionId !== sessionAtStart) return;
                            await executeSkillAction(aiPlayer, chosenObs);
                            if (checkGameOver()) return;
                            continue;
                        }
                    }
                }

                if (aiPlayer.classKey === 'alchemist' && skillDice) {
                    const skillSpaces = getValidTargetsForClass(aiPlayer, 'SKILL');
                    if (skillSpaces.length > 0) {
                        const chosenSpace = findClosestSpaceToTarget(skillSpaces, humanPlayer.r, humanPlayer.c);
                        if (chosenSpace) {
                            selectedDiceIdx = rolledDicePool.findIndex(d => d === skillDice);
                            await new Promise(r => setTimeout(r, 450));
                            if (currentGameSessionId !== sessionAtStart) return;
                            await executeSkillAction(aiPlayer, chosenSpace);
                            if (checkGameOver()) return;
                            continue;
                        }
                    }
                }

                if (aiPlayer.classKey === 'assassin' && skillDice) {
                    const skillSpaces = getValidTargetsForClass(aiPlayer, 'SKILL');
                    if (skillSpaces.length > 0) {
                        const directHitSpace = skillSpaces.find(s => {
                            const distToHuman = Math.abs(s.r - humanPlayer.r) + Math.abs(s.c - humanPlayer.c);
                            return distToHuman === 1;
                        });

                        const chosenSpace = directHitSpace || findClosestSpaceToTarget(skillSpaces, humanPlayer.r, humanPlayer.c);

                        if (chosenSpace) {
                            selectedDiceIdx = rolledDicePool.findIndex(d => d === skillDice);
                            await new Promise(r => setTimeout(r, 450));
                            if (currentGameSessionId !== sessionAtStart) return;
                            await executeSkillAction(aiPlayer, chosenSpace);
                            if (checkGameOver()) return;
                            continue;
                        }
                    }
                }

                if (aiPlayer.classKey === 'scout' && skillDice) {
                    const skillSpaces = getValidTargetsForClass(aiPlayer, 'SKILL');
                    if (skillSpaces.length > 0) {
                        let maxDist = -1;
                        let farthestSpaces = [];
                        skillSpaces.forEach(space => {
                            const d = Math.abs(space.r - humanPlayer.r) + Math.abs(space.c - humanPlayer.c);
                            if (d > maxDist) {
                                maxDist = d;
                                farthestSpaces = [space];
                            } else if (d === maxDist) {
                                farthestSpaces.push(space);
                            }
                        });
                        const targetSpace = farthestSpaces[Math.floor(Math.random() * farthestSpaces.length)];

                        selectedDiceIdx = rolledDicePool.findIndex(d => d === skillDice);
                        await new Promise(r => setTimeout(r, 450));
                        if (currentGameSessionId !== sessionAtStart) return;
                        await executeSkillAction(aiPlayer, targetSpace);
                        if (checkGameOver()) return;
                        continue;
                    }
                }

                if (skillDice && canHitHumanFrom(aiPlayer.r, aiPlayer.c, 'SKILL')) {
                    const targets = getValidTargetsForClass(aiPlayer, 'SKILL');
                    const humanTarget = targets.find(t => !t.isObstacle && t.target && t.target.isHuman);
                    if (humanTarget) {
                        selectedDiceIdx = rolledDicePool.findIndex(d => d === skillDice);
                        await new Promise(r => setTimeout(r, 450));
                        if (currentGameSessionId !== sessionAtStart) return;
                        await executeSkillAction(aiPlayer, humanTarget);
                        if (checkGameOver()) return;
                        continue;
                    }
                }

                if (attackDice && canHitHumanFrom(aiPlayer.r, aiPlayer.c, 'ATTACK')) {
                    const targets = getValidTargetsForClass(aiPlayer, 'ATTACK');
                    const humanTarget = targets.find(t => !t.isObstacle && t.target && t.target.isHuman);
                    if (humanTarget) {
                        selectedDiceIdx = rolledDicePool.findIndex(d => d === attackDice);
                        await new Promise(r => setTimeout(r, 450));
                        if (currentGameSessionId !== sessionAtStart) return;
                        await executeAttackAction(aiPlayer, humanTarget, 'ATTACK');
                        if (checkGameOver()) return;
                        continue;
                    }
                }

                const moveDice = unusedDice.find(d => d.type === 'MOVE');
                if (moveDice && !isAtOptimalPosition(aiPlayer.r, aiPlayer.c)) {
                    const isFleeing = (cData.aiType === 'fleeing');
                    const nextStep = findNextStepAStar(aiPlayer.r, aiPlayer.c, humanPlayer.r, humanPlayer.c, isFleeing, aiPlayer);

                    if (nextStep) {
                        selectedDiceIdx = rolledDicePool.findIndex(d => d === moveDice);
                        await new Promise(r => setTimeout(r, 400));
                        if (currentGameSessionId !== sessionAtStart) return;
                        await executeMoveAction(aiPlayer, nextStep.r, nextStep.c);
                        if (checkGameOver()) return;
                        continue;
                    }
                }

                selectedDiceIdx = rolledDicePool.findIndex(d => d === unusedDice[0]);
                consumeSelectedDice();
                await new Promise(r => setTimeout(r, 150));
            }

            if (currentGameSessionId !== sessionAtStart) return;
            logCombat(`🤖 ${aiPlayer.name} 行動結束`);
            await new Promise(r => setTimeout(r, 300));
            if (currentGameSessionId !== sessionAtStart) return;
            currentTurnIdx++;
            processNextTurn();
        }

        function isValidGrid(r, c) { return r >= 0 && r < 9 && c >= 0 && c < 9; }
        function isOccupied(r, c) {
            const hasPlayer = players.some(p => p.alive && p.r === r && p.c === c);
            const hasObs = obstacles[`${r},${c}`] && obstacles[`${r},${c}`].hp > 0;
            return hasPlayer || hasObs;
        }
        function getPlayerAt(r, c) { return players.find(p => p.alive && p.r === r && p.c === c); }

        let isLogExpanded = false;

        function toggleCombatLog() {
            isLogExpanded = !isLogExpanded;
            const logEl = document.getElementById('combat-log');

            if (isLogExpanded) {
                logEl.className = "absolute top-0 left-0 w-full h-[235px] z-40 lined-paper-2 text-[11px] text-slate-800 overflow-y-auto font-mono cursor-pointer shadow-2xl transition-all duration-200 select-none";
            } else {
                logEl.className = "w-full h-full lined-paper-2 text-[11px] text-slate-800 overflow-hidden font-mono cursor-pointer transition-all duration-200 select-none relative shadow-md";
            }
            logEl.scrollTop = logEl.scrollHeight;
            setTimeout(() => {
                logEl.scrollTop = logEl.scrollHeight;
            }, 220);
        }

        function logCombat(msg) {
            const contentEl = document.getElementById('combat-log-content');
            const logEl = document.getElementById('combat-log');
            if (!contentEl) return;

            const p = document.createElement('p');
            p.innerText = msg;
            p.className = 'leading-[22px] h-[22px] truncate font-medium';
            contentEl.appendChild(p);

            while (contentEl.children.length > 100) {
                contentEl.removeChild(contentEl.firstChild);
            }

            logEl.scrollTop = logEl.scrollHeight;
        }

        function checkGameOver() {
            const human = players.find(p => p.isHuman);
            const aliveAIs = players.filter(p => !p.isHuman && p.alive);

            if (!human || !human.alive) {
                showGameOverModal(false);
                return true;
            } else if (aliveAIs.length === 0) {
                showGameOverModal(true);
                return true;
            }
            return false;
        }

        function showGameOverModal(isVictory) {
            const modal = document.getElementById('game-over-modal');
            const icon = document.getElementById('game-over-icon');
            const title = document.getElementById('game-over-title');
            const desc = document.getElementById('game-over-desc');

            if (isVictory) {
                icon.innerText = "🏆";
                title.innerText = "遊戲勝利！";
                title.className = "text-xl font-black mb-1 text-emerald-400";
                desc.innerText = "你展現了高超的戰術，成功殲滅了所有對手！";
            } else {
                icon.innerText = "☠️";
                title.innerText = "戰敗...";
                title.className = "text-xl font-black mb-1 text-red-500";
                desc.innerText = "你不幸陣亡，再試一次吧！";
            }
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        window.onload = function() {
            initGame();
        };
    </script>
</body>
